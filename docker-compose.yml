name: agent-os
services:
  hermes:
    # Pin with HERMES_IMAGE (ideally by digest) so every install runs the tested build.
    image: ${HERMES_IMAGE:-nousresearch/hermes-agent:${HERMES_TAG:-latest}}
    container_name: agent-os-hermes
    restart: unless-stopped
    command: gateway run
    ports:
      - "127.0.0.1:8642:8642"
    expose:
      - "9119"
    volumes:
      - ${HERMES_HOME_DIR:-./data/hermes}:/opt/data
    environment:
      API_SERVER_ENABLED: "true"
      API_SERVER_HOST: "0.0.0.0"
      API_SERVER_KEY: ${API_SERVER_KEY:?run ./install.sh first}
      HERMES_DASHBOARD: "1"
      HERMES_DASHBOARD_BASIC_AUTH_USERNAME: ${DASHBOARD_USER:-admin}
      HERMES_DASHBOARD_BASIC_AUTH_PASSWORD: ${DASHBOARD_PASSWORD:?run ./install.sh first}
      # The memory plugin refuses to start without HONCHO_API_KEY, even though our
      # self-hosted Honcho (AUTH_USE_AUTH=false, internal network only) ignores it.
      # Any non-empty value satisfies the check; the endpoint comes from honcho.json.
      HONCHO_API_KEY: "${HONCHO_API_KEY:-self-hosted}"
    mem_limit: ${HERMES_MEM_LIMIT:-3G}
    cpus: 2.0

  # Reverse proxy in front of the dashboard: injects Suburban Cyber branding into the
  # pre-auth login page (which themes/plugins can't reach) and is the future TLS endpoint.
  proxy:
    image: nginx:1.27-alpine
    container_name: agent-os-proxy
    restart: unless-stopped
    depends_on: [hermes]
    ports:
      - "${DASHBOARD_BIND:-127.0.0.1}:9119:9119"
    volumes:
      - ./templates/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./data/hermes/brand:/srv/brand:ro
    mem_limit: 128M

  # Optional outbound tunnel (Cloudflare). Enabled by the installer's "Cloudflare
  # Tunnel" access mode (profile "tunnel" + CLOUDFLARE_TUNNEL_TOKEN). cloudflared
  # dials OUT to Cloudflare — no inbound ports, works behind any NAT/firewall — and
  # the public hostname -> service routing is configured in your Cloudflare Zero
  # Trust dashboard (point the dashboard hostname at http://proxy:9119; optionally
  # n8n at http://n8n:5678 and Paperclip at http://paperclip:3100). cloudflared
  # reaches those over the compose network even though they bind to loopback on the
  # host. Nothing in the tunnel passes through Suburban Cyber unless the token is
  # from Suburban Cyber's account — a self-hoster uses their own token, same code.
  cloudflared:
    profiles: ["tunnel"]
    image: cloudflare/cloudflared:${CLOUDFLARED_TAG:-2026.7.3}
    container_name: agent-os-cloudflared
    restart: unless-stopped
    depends_on: [proxy]
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN:-}
    mem_limit: 128M

  # Dedicated TLS terminator for the Hermes gateway runs API (the Paperclip -> Hermes
  # hop). Kept as its own container on purpose: Paperclip won't run an agent that
  # reaches a non-loopback host over plain HTTP, so this presents the Hermes runs API
  # over HTTPS. Isolating it means a missing or bad cert only crash-loops this
  # container and can never take the dashboard proxy down. Reached internally as
  # https://hermes-gateway:8443.
  gateway-tls:
    # Only needed when Paperclip (control-plane) runs; it's the sole consumer.
    profiles: ["control-plane"]
    image: nginx:1.27-alpine
    container_name: agent-os-gateway-tls
    restart: unless-stopped
    depends_on: [hermes]
    volumes:
      - ./templates/gateway-tls.conf:/etc/nginx/conf.d/default.conf:ro
      - ./data/tls/server.crt:/etc/nginx/tls/server.crt:ro
      - ./data/tls/server.key:/etc/nginx/tls/server.key:ro
    expose:
      - "8443"
    networks:
      default:
        # Paperclip connects to https://hermes-gateway:8443; the cert is issued for
        # this name, so the alias must match the SAN in scripts/gen-tls.sh.
        aliases:
          - hermes-gateway
    mem_limit: 64M

  # Connectors service: stores the user's connected accounts (email first; bookings
  # and the Paperclip bridge reuse it) and talks to them. Reached by the dashboard
  # through the proxy at /api/connectors/. Authorizes each call against Hermes.
  connectors:
    build: ./connectors
    image: agent-os/connectors:0.1
    container_name: agent-os-connectors
    restart: unless-stopped
    depends_on: [hermes]
    environment:
      CONNECTORS_KEY: ${CONNECTORS_KEY:?run ./install.sh first}
      HERMES_AUTH_URL: "http://hermes:9119/api/auth/me"
      CONNECTORS_DB: "/data/connectors.db"
      N8N_INTERNAL_URL: "http://n8n:5678"
      # Orchestration bridge target. Bundled Paperclip by default; for the
      # connect-to-existing path, override PAPERCLIP_URL (+ PAPERCLIP_API_KEY,
      # PAPERCLIP_COMPANY_ID) in .env. The bridge is read-only (GET) by design.
      PAPERCLIP_URL: "${PAPERCLIP_URL:-http://paperclip:3100}"
      PAPERCLIP_API_KEY: "${PAPERCLIP_API_KEY:-}"
      PAPERCLIP_COMPANY_ID: "${PAPERCLIP_COMPANY_ID:-}"
      # Hermes gateway the unified create-agent flow points Paperclip agents at.
      # HERMES_GATEWAY_URL is the HTTPS endpoint Paperclip talks to (TLS terminated
      # by the proxy); plain HTTP here would fail Paperclip's non-loopback safety
      # check and the agent would never run. HERMES_API_URL stays available for any
      # direct, non-agent calls.
      HERMES_API_URL: "${HERMES_API_URL:-http://hermes:8642}"
      HERMES_GATEWAY_URL: "${HERMES_GATEWAY_URL:-https://hermes-gateway:8443}"
      HERMES_API_KEY: "${API_SERVER_KEY:-}"
      # Paperclip dollar budget hard-stop. Cents/month; 0 = off (default). It fails
      # closed on usage it can't price, and Hermes-gateway runs usually report no
      # dollar cost — a cap would pause the company at $0 spent. Spend protection =
      # RUN_MAX_ATTEMPTS (below) + a hard spend limit at your LLM provider.
      COMPANY_BUDGET_CENTS: "${COMPANY_BUDGET_CENTS:-0}"
      AGENT_BUDGET_CENTS: "${AGENT_BUDGET_CENTS:-0}"
      # Per-task fast-stop: max run-creations for one agent+task before the gateway
      # halts it (trips in seconds on a tight loop, long before the dollar cap). 0 = off.
      RUN_MAX_ATTEMPTS: "${RUN_MAX_ATTEMPTS:-6}"
      # Bearer token Hermes uses to call the chat tools (MCP) endpoint. Empty = off.
      CHAT_TOOLS_TOKEN: "${CHAT_TOOLS_TOKEN:-}"
      CHAT_TASKS_PER_HOUR: "${CHAT_TASKS_PER_HOUR:-20}"
      N8N_TOOLS_PROFILES: "${N8N_TOOLS_PROFILES:-}"
    volumes:
      - connectors-data:/data
    expose:
      - "8000"
    mem_limit: 256M

  # Bundled automation engine (our own fresh n8n — never a migration of anyone's).
  # Runs under the "automation" profile. Reached directly on :5678 for the editor
  # (one-click "Open builder"); the dashboard reads workflow/run status through
  # n8n's public API via the connectors service (internal, http://n8n:5678).
  n8n:
    profiles: ["automation"]
    # Pulled from n8n's official registry (not mirrored: see THIRD_PARTY_NOTICES.md).
    image: ${N8N_IMAGE:-n8nio/n8n:${N8N_TAG:-latest}}
    container_name: agent-os-n8n
    restart: unless-stopped
    ports:
      # Loopback-only, never the LAN: reached through the dashboard / tunnel / SSH
      # (CODE_REVIEW F-04). INTERNAL_BIND is independent of DASHBOARD_BIND.
      - "${INTERNAL_BIND:-127.0.0.1}:5678:5678"
    environment:
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?run ./install.sh first}
      N8N_HOST: "${N8N_HOST:-0.0.0.0}"
      N8N_PORT: "5678"
      N8N_PROTOCOL: "${N8N_PROTOCOL:-http}"
      # Login cookie over plain HTTP by default (LAN/local). Behind an HTTPS tunnel
      # set N8N_SECURE_COOKIE=true, N8N_PROTOCOL=https, N8N_PROXY_HOPS=1, and
      # N8N_PUBLIC_URL=https://<your n8n tunnel host>/ (see README access section).
      N8N_SECURE_COOKIE: "${N8N_SECURE_COOKIE:-false}"
      # Trust X-Forwarded-* from the tunnel/reverse proxy (0 = don't trust any).
      N8N_PROXY_HOPS: "${N8N_PROXY_HOPS:-0}"
      # Empty = n8n derives these from host/protocol; set to the public URL behind a tunnel.
      WEBHOOK_URL: "${N8N_PUBLIC_URL:-}"
      N8N_EDITOR_BASE_URL: "${N8N_PUBLIC_URL:-}"
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_HIRING_BANNER_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      GENERIC_TIMEZONE: ${N8N_TIMEZONE:-America/New_York}
    volumes:
      - n8n-data:/home/node/.n8n
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:5678/healthz',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    mem_limit: 1G

  # Bundled agent-orchestration control plane (our own fresh Paperclip, never a
  # migration). Under the "control-plane" profile. Reachable only on the compose
  # network — the dashboard is the cockpit. Single-container build, embedded DB.
  # NOTE: builds from source (Node monorepo) — the first build is heavy.
  #
  # Must run "authenticated" with a LAN bind: local_trusted forces a loopback
  # bind (container-local only), which the connectors service can't reach across
  # containers. Private exposure keeps it off the public internet. Agent/attention
  # reads need a board API key (authenticated mode); health is open for the bridge.
  paperclip:
    profiles: ["control-plane"]
    build:
      context: https://github.com/paperclipai/paperclip.git#253bf071f0a496554b61fff897ad3f11afaf8766
      dockerfile: Dockerfile
    # Prebuilt by .github/workflows/images.yml. If it can't be pulled, compose
    # builds it from the pinned upstream commit above instead.
    image: ${PAPERCLIP_IMAGE:-ghcr.io/ajr1303/agent-os-paperclip:253bf07}
    container_name: agent-os-paperclip
    restart: unless-stopped
    pids_limit: 2048
    stop_grace_period: 90s
    environment:
      HOST: "0.0.0.0"
      PAPERCLIP_HOME: "/paperclip"
      PAPERCLIP_DEPLOYMENT_MODE: "authenticated"
      PAPERCLIP_BIND: "lan"
      PAPERCLIP_DEPLOYMENT_EXPOSURE: "private"
      # The URL you reach the Paperclip UI at in a browser (used for auth cookies).
      # Set to your LAN URL in .env, e.g. http://10.100.50.250:3100.
      PAPERCLIP_PUBLIC_URL: "${PAPERCLIP_PUBLIC_URL:-http://paperclip:3100}"
      # Must include "paperclip" (the internal name the dashboard bridge uses) plus
      # the host you browse to. Override in .env to add your LAN IP.
      PAPERCLIP_ALLOWED_HOSTNAMES: "${PAPERCLIP_ALLOWED_HOSTNAMES:-paperclip,localhost,127.0.0.1}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?run ./install.sh first}
      PAPERCLIP_TOOL_ACTION_SIGNING_SECRET: ${PAPERCLIP_TOOL_ACTION_SIGNING_SECRET:?run ./install.sh first}
      # Trust our internal gateway CA so Paperclip accepts the HTTPS Hermes endpoint
      # (https://hermes-gateway:8443) without disabling TLS verification.
      NODE_EXTRA_CA_CERTS: "/etc/ssl/agent-os-ca.crt"
    # Loopback-only, never the LAN (CODE_REVIEW F-04): reached through the dashboard,
    # the tunnel, or an SSH tunnel. INTERNAL_BIND is independent of DASHBOARD_BIND.
    ports:
      - "${INTERNAL_BIND:-127.0.0.1}:3100:3100"
    volumes:
      - paperclip-data:/paperclip
      - ./data/tls/ca.crt:/etc/ssl/agent-os-ca.crt:ro
    healthcheck:
      # Paperclip runs on a Node image that has no curl; probe with node instead
      # (matches the n8n healthcheck). A curl probe reports unhealthy forever and
      # sends the watchdog into a restart loop.
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3100/api/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    expose:
      - "3100"
    mem_limit: 2G

  honcho-db:
    profiles: ["memory"]
    image: pgvector/pgvector:pg16
    container_name: agent-os-honcho-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: honcho
      POSTGRES_USER: honcho
      # Required, not a literal fallback: ${:-unset} would silently initialise the
      # DB with the password "unset" on a hand-edited or partially-restored .env,
      # giving every container on the network a predictable login (CODE_REVIEW F-31).
      POSTGRES_PASSWORD: ${HONCHO_DB_PASSWORD:?run ./install.sh first}
      PGDATA: /var/lib/postgresql/data/pgdata
    command: ["postgres", "-c", "max_connections=100"]
    volumes:
      - honcho-pgdata:/var/lib/postgresql/data
      - ./templates/honcho-init.sql:/docker-entrypoint-initdb.d/00-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U honcho -d honcho"]
      interval: 5s
      timeout: 5s
      retries: 10
    mem_limit: 1G

  honcho-api:
    profiles: ["memory"]
    build:
      context: https://github.com/plastic-labs/honcho.git#323f7e79923ffef968669fe4069d8cebed3ec8c3
      dockerfile: Dockerfile
    image: ${HONCHO_IMAGE:-ghcr.io/ajr1303/agent-os-honcho:323f7e7}
    container_name: agent-os-honcho-api
    restart: unless-stopped
    entrypoint: ["sh", "docker/entrypoint.sh"]
    depends_on:
      honcho-db: { condition: service_healthy }
    env_file:
      - path: honcho.env
        required: false
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    mem_limit: 1G

  honcho-deriver:
    profiles: ["memory"]
    # Same build context + image tag as honcho-api. Without the build context here,
    # `docker compose up` treats agent-os/honcho as a registry image and tries to
    # PULL it ("pull access denied … repository does not exist"), because it's a
    # local build. Declaring the build makes compose build/reuse the shared image.
    build:
      context: https://github.com/plastic-labs/honcho.git#323f7e79923ffef968669fe4069d8cebed3ec8c3
      dockerfile: Dockerfile
    image: ${HONCHO_IMAGE:-ghcr.io/ajr1303/agent-os-honcho:323f7e7}
    container_name: agent-os-honcho-deriver
    restart: unless-stopped
    entrypoint: ["/app/.venv/bin/python", "-m", "src.deriver"]
    depends_on:
      honcho-api: { condition: service_healthy }
    env_file:
      - path: honcho.env
        required: false
    mem_limit: 1G

volumes:
  honcho-pgdata:
  connectors-data:
  n8n-data:
  paperclip-data:
