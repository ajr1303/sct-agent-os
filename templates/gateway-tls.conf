# TLS terminator for the Hermes gateway runs API (the Paperclip -> Hermes hop).
#
# Paperclip refuses to verify/run an agent that reaches a non-loopback host over
# plain HTTP. Our Paperclip and Hermes are separate containers, so Paperclip
# connects here over HTTPS (trusting our internal CA via NODE_EXTRA_CA_CERTS) and
# we proxy to the Hermes API server. Internal to the compose network only; never
# published to the host. Runs in its own container so a cert problem can't take
# the dashboard proxy down.
server {
    listen 8443 ssl;
    server_name hermes-gateway;
    # Docker's embedded DNS, so the hermes upstream re-resolves after a restart.
    resolver 127.0.0.11 valid=10s ipv6=off;

    ssl_certificate     /etc/nginx/tls/server.crt;
    ssl_certificate_key /etc/nginx/tls/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    location / {
        # Per-task fast-stop. Every request is cleared by the connectors
        # /gateway/authorize subrequest, which only *meters* run-creation
        # (POST /v1/runs) per session key and lets status/events/stop pass. When a
        # task exceeds its attempt budget the subrequest returns 403; we remap that
        # to a 402 with a clear body so the adapter treats it as a terminal error
        # and halts the task (429/5xx would be retried — exactly what we must avoid).
        auth_request /_gw_authz;
        error_page 403 = @gw_denied;

        set $gw hermes;
        proxy_pass http://$gw:8642;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # The runs API streams Server-Sent Events at /v1/runs/{id}/events, so keep
        # the upstream connection open and don't buffer the response.
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Internal subrequest: ask the connectors service whether this run may start.
    # Never reachable from a client (internal). $request_method / $request_uri here
    # are the original request's, so connectors can meter POST /v1/runs precisely.
    location = /_gw_authz {
        internal;
        set $authz connectors;
        proxy_pass http://$authz:8000/gateway/authorize;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Gw-Method $request_method;
        proxy_set_header X-Gw-Uri $request_uri;
        proxy_set_header X-Hermes-Session-Key $http_x_hermes_session_key;
    }

    location @gw_denied {
        default_type application/json;
        return 402 '{"error":"run-attempt budget reached for this task; halted by Agent OS fast-stop"}';
    }
}
