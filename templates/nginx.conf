# Suburban Cyber Agent OS reverse proxy.
# Proxies the Hermes dashboard and injects branding into the pre-auth login page.
map $http_upgrade $connection_upgrade { default upgrade; '' close; }

server {
    listen 9119;
    server_name _;
    # Docker's embedded DNS, so the upstream is re-resolved (survives Hermes recreation -> no stale 502)
    resolver 127.0.0.11 valid=10s ipv6=off;

    location /sct-brand/ {
        alias /srv/brand/;
        add_header Cache-Control "public, max-age=60";
    }

    location / {
        set $up hermes;
        proxy_pass http://$up:9119;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # WebSocket upgrade (chat PTY + event stream)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        # Disable upstream compression so sub_filter can edit the HTML shell
        proxy_set_header Accept-Encoding "";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        sub_filter_once off;
        sub_filter_types text/html;
        sub_filter '</head>' '<script defer src="/sct-brand/login.js"></script></head>';
    }
}
