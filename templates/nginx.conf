# Suburban Cyber Agent OS reverse proxy.
# Proxies the Hermes dashboard and injects branding into the pre-auth login page.
map $http_upgrade $connection_upgrade { default upgrade; '' close; }

server {
    listen 9119;
    server_name _;

    # Branding assets (logo + login rebrand script)
    location /sct-brand/ {
        alias /srv/brand/;
        add_header Cache-Control "public, max-age=300";
    }

    location / {
        proxy_pass http://hermes:9119;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # WebSocket upgrade (chat PTY + event stream)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        # Disable upstream compression so sub_filter can edit the HTML shell
        proxy_set_header Accept-Encoding "";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        # Inject the login-rebrand script into every HTML page (it self-limits to /login)
        sub_filter_once off;
        sub_filter_types text/html;
        sub_filter '</head>' '<script defer src="/sct-brand/login.js"></script></head>';
    }
}
