# Suburban Cyber Agent OS reverse proxy.
# Proxies the Hermes dashboard and injects branding into the pre-auth login page.
map $http_upgrade $connection_upgrade { default upgrade; '' close; }

server {
    listen 9119;
    server_name _;
    # Redirects stay relative, so they keep the browser's own scheme and host
    # (HTTPS at a tunnel, plain HTTP on a LAN) instead of this proxy's.
    absolute_redirect off;
    # Docker's embedded DNS, so the upstream is re-resolved (survives Hermes recreation -> no stale 502)
    resolver 127.0.0.11 valid=10s ipv6=off;

    location /sct-brand/ {
        alias /srv/brand/;
        # Revalidate every load (ETag/304, tiny files) so branding/links/version
        # changes show up right after an update without a hard refresh.
        add_header Cache-Control "no-cache";
    }

    # Hermes declares <link rel="icon" href="/favicon.ico" type="image/svg+xml">,
    # so serve our SVG monogram at that exact path (type matches the declaration).
    location = /favicon.ico {
        alias /srv/brand/favicon.svg;
        default_type image/svg+xml;
        types { }
        add_header Cache-Control "public, max-age=3600";
    }

    # The run fast-stop's authorize endpoint is unauthenticated by design (its only
    # legitimate caller is the in-cluster gateway-tls auth_request). Never expose it
    # to the browser: a forged call could burn a task's attempt budget. Exact-match
    # location outranks the /api/connectors/ prefix below. The authed companions
    # /gateway/blocked and /gateway/unblock are NOT blocked — the Tasks page uses them.
    location ^~ /api/connectors/gateway/ { return 404; }
    # The chat-tools (MCP) endpoint is for the Hermes container only, never a browser.
    location ^~ /api/connectors/mcp { return 404; }
    # Agents on their own machines use these on the team board's address, not here.
    location ^~ /api/connectors/agent-tools { return 404; }
    # Internal callers only (the stuck-agent watch workflow inside n8n), never a browser.
    location ^~ /api/connectors/internal/ { return 404; }

    # --- Two-step sign-in (authenticator app code) ---------------------------------
    # Off unless the owner switches it on. When it is on, scripts/host-requests.sh
    # drops two small files into /etc/nginx/aos/ that make the locations below ask
    # /_mfa_check first; a browser that has not entered a code is sent to the code
    # page. With the files absent these includes match nothing and nothing changes.
    location = /_mfa_check {
        internal;
        # The size limit of the request being checked is applied here too. Without
        # this, a file upload over 1 MB failed whenever two-step sign-in was on.
        # The real limit is set on the route that receives the upload.
        client_max_body_size 25m;
        set $conn connectors;
        proxy_pass http://$conn:8000/mfa/check;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
    }
    location @mfa_page { return 302 /sct-brand/mfa.html; }
    location @mfa_api {
        default_type application/json;
        return 401 '{"error":"Enter your sign-in code to continue. Reload the page."}';
    }
    # The code page's own calls must work before a code has been entered.
    location ^~ /api/connectors/mfa/ {
        set $conn connectors;
        rewrite ^/api/connectors/(.*)$ /$1 break;
        proxy_pass http://$conn:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header Cookie $http_cookie;
    }

    # Computers reporting to My devices, and the scripts they download. They have no
    # browser session, so the sign-in code gate cannot apply; each call carries that
    # computer's own token, which the service checks.
    location ~ ^/api/connectors/devices/(report$|enroll$|reporter/) {
        client_max_body_size 256k;
        set $conn connectors;
        rewrite ^/api/connectors/(.*)$ /$1 break;
        proxy_pass http://$conn:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    # Project and chat file uploads: the only calls that may carry a large body.
    location ~ ^/api/connectors/(projects/[0-9]+|chat)/files$ {
        include /etc/nginx/aos/mfa-gate-api*.inc;
        client_max_body_size 25m;
        set $conn connectors;
        rewrite ^/api/connectors/(.*)$ /$1 break;
        proxy_pass http://$conn:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header Cookie $http_cookie;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Connectors service (email + future bookings/Paperclip bridge). The service
    # authorizes each request itself by validating the forwarded dashboard cookie
    # against Hermes, so no separate auth layer is needed here.
    location /api/connectors/ {
        include /etc/nginx/aos/mfa-gate-api*.inc;
        # NOTE: `set` must come BEFORE `rewrite ... break` — the break flag halts
        # all later rewrite-phase directives in this block, and `set` is one of them.
        set $conn connectors;
        rewrite ^/api/connectors/(.*)$ /$1 break;
        proxy_pass http://$conn:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header Cookie $http_cookie;
        proxy_read_timeout 60s;
    }

    location / {
        include /etc/nginx/aos/mfa-gate-page*.inc;
        set $up hermes;
        proxy_pass http://$up:9119;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # WebSocket upgrade (chat PTY + event stream)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        # Disable upstream compression so sub_filter can edit the HTML shell
        proxy_set_header Accept-Encoding "";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        sub_filter_once off;
        sub_filter_types text/html;
        # links.js (no defer) sets window.__SCT_LINKS__ before the dashboard plugins
        # run, so the "Open Paperclip/builder" buttons use the configured public URLs
        # (e.g. the tunnel hostnames) instead of host:3100 / host:5678.
        # sct.css = global overrides (readable dropdowns); the icon links add the
        # Suburban Cyber monogram for browsers/phones that look past /favicon.ico.
        sub_filter '</head>' '<link rel="stylesheet" href="/sct-brand/sct.css"><link rel="icon" type="image/png" sizes="32x32" href="/sct-brand/favicon-32.png"><link rel="apple-touch-icon" href="/sct-brand/apple-touch-icon.png"><link rel="manifest" href="/sct-brand/manifest.json"><meta name="theme-color" content="#0b1620"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Agent OS"><script src="/sct-brand/links.js"></script><script defer src="/sct-brand/login.js"></script><script defer src="/sct-brand/nav.js"></script></head>';
    }
}

# --- Team (Paperclip) and Automations (n8n) public addresses ------------------------
# The tunnel reaches these two apps through this proxy (see the "edge" network in
# docker-compose.yml), so their addresses sit behind the dashboard sign-in instead of
# facing the internet with only their own login pages. A browser that has not been
# let in is sent to the dashboard to sign in and comes straight back. The connectors
# service decides (/gate/check); if it is down, these addresses stay closed.
# Upstreams use container names: the service names "paperclip" and "n8n" also point at
# this proxy on the edge network, and must not be used here.
server {
    listen 3100;
    server_name _;
    absolute_redirect off;
    resolver 127.0.0.11 valid=10s ipv6=off;
    client_max_body_size 100m;

    location = /_aos/check {
        internal;
        set $conn connectors;
        proxy_pass http://$conn:8000/gate/check;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Gate-Host $host;
        proxy_set_header X-Gate-Service paperclip;
        proxy_set_header X-Original-URI $request_uri;
        proxy_set_header X-Gate-Auth $http_authorization;
        proxy_set_header Cookie $http_cookie;
    }
    location = /_aos/enter {
        set $conn connectors;
        proxy_pass http://$conn:8000/gate/enter$is_args$args;
        proxy_set_header X-Gate-Host $host;
    }
    location @aos_begin {
        set $conn connectors;
        rewrite ^ /gate/begin break;
        proxy_pass http://$conn:8000;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Gate-Host $host;
        proxy_set_header X-Original-URI $request_uri;
        proxy_set_header Accept $http_accept;
        proxy_set_header Sec-Fetch-Mode $http_sec_fetch_mode;
    }
    # Task tools for agents on their own machines. No browser sign-in here: the
    # connectors service checks the caller's own Paperclip API key on every call.
    location ^~ /api/agent-os/ {
        client_max_body_size 6m;
        set $conn connectors;
        rewrite ^/api/agent-os/(.*)$ /agent-tools/$1 break;
        proxy_pass http://$conn:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $http_x_forwarded_for;
        proxy_set_header Cookie "";
        proxy_read_timeout 120s;
    }
    location / {
        auth_request /_aos/check;
        error_page 401 = @aos_begin;
        set $up agent-os-paperclip;
        proxy_pass http://$up:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $http_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}

server {
    listen 5678;
    server_name _;
    absolute_redirect off;
    resolver 127.0.0.11 valid=10s ipv6=off;
    client_max_body_size 100m;

    location = /_aos/check {
        internal;
        set $conn connectors;
        proxy_pass http://$conn:8000/gate/check;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Gate-Host $host;
        proxy_set_header X-Gate-Service n8n;
        proxy_set_header X-Original-URI $request_uri;
        proxy_set_header X-Gate-Key $http_x_n8n_api_key;
        proxy_set_header Cookie $http_cookie;
    }
    location = /_aos/enter {
        set $conn connectors;
        proxy_pass http://$conn:8000/gate/enter$is_args$args;
        proxy_set_header X-Gate-Host $host;
    }
    location @aos_begin {
        set $conn connectors;
        rewrite ^ /gate/begin break;
        proxy_pass http://$conn:8000;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Gate-Host $host;
        proxy_set_header X-Original-URI $request_uri;
        proxy_set_header Accept $http_accept;
        proxy_set_header Sec-Fetch-Mode $http_sec_fetch_mode;
    }
    # Outside services call these (webhooks, public forms, MCP triggers). They carry
    # their own protection inside n8n and must keep working without a browser sign-in.
    location ~ ^/(webhook|webhook-test|webhook-waiting|form|form-test|form-waiting|mcp|mcp-test)/ {
        set $up agent-os-n8n;
        proxy_pass http://$up:5678;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $http_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }
    location / {
        auth_request /_aos/check;
        error_page 401 = @aos_begin;
        set $up agent-os-n8n;
        proxy_pass http://$up:5678;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $http_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
