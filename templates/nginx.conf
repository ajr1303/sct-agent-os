# Suburban Cyber Agent OS reverse proxy.
# Proxies the Hermes dashboard and injects branding into the pre-auth login page.
map $http_upgrade $connection_upgrade { default upgrade; '' close; }

server {
    listen 9119;
    server_name _;
    # Docker's embedded DNS, so the upstream is re-resolved (survives Hermes recreation -> no stale 502)
    resolver 127.0.0.11 valid=10s ipv6=off;

    location /sct-brand/ {
        alias /srv/brand/;
        # Revalidate every load (ETag/304, tiny files) so branding/links/version
        # changes show up right after an update without a hard refresh.
        add_header Cache-Control "no-cache";
    }

    # Hermes declares <link rel="icon" href="/favicon.ico" type="image/svg+xml">,
    # so serve our SVG monogram at that exact path (type matches the declaration).
    location = /favicon.ico {
        alias /srv/brand/favicon.svg;
        default_type image/svg+xml;
        types { }
        add_header Cache-Control "public, max-age=3600";
    }

    # The run fast-stop's authorize endpoint is unauthenticated by design (its only
    # legitimate caller is the in-cluster gateway-tls auth_request). Never expose it
    # to the browser: a forged call could burn a task's attempt budget. Exact-match
    # location outranks the /api/connectors/ prefix below. The authed companions
    # /gateway/blocked and /gateway/unblock are NOT blocked — the Tasks page uses them.
    location = /api/connectors/gateway/authorize { return 404; }
    # The chat-tools (MCP) endpoint is for the Hermes container only, never a browser.
    location ^~ /api/connectors/mcp { return 404; }

    # Connectors service (email + future bookings/Paperclip bridge). The service
    # authorizes each request itself by validating the forwarded dashboard cookie
    # against Hermes, so no separate auth layer is needed here.
    location /api/connectors/ {
        # NOTE: `set` must come BEFORE `rewrite ... break` — the break flag halts
        # all later rewrite-phase directives in this block, and `set` is one of them.
        set $conn connectors;
        rewrite ^/api/connectors/(.*)$ /$1 break;
        proxy_pass http://$conn:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Cookie $http_cookie;
        proxy_read_timeout 60s;
    }

    location / {
        set $up hermes;
        proxy_pass http://$up:9119;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # WebSocket upgrade (chat PTY + event stream)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        # Disable upstream compression so sub_filter can edit the HTML shell
        proxy_set_header Accept-Encoding "";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        sub_filter_once off;
        sub_filter_types text/html;
        # links.js (no defer) sets window.__SCT_LINKS__ before the dashboard plugins
        # run, so the "Open Paperclip/builder" buttons use the configured public URLs
        # (e.g. the tunnel hostnames) instead of host:3100 / host:5678.
        # sct.css = global overrides (readable dropdowns); the icon links add the
        # Suburban Cyber monogram for browsers/phones that look past /favicon.ico.
        sub_filter '</head>' '<link rel="stylesheet" href="/sct-brand/sct.css"><link rel="icon" type="image/png" sizes="32x32" href="/sct-brand/favicon-32.png"><link rel="apple-touch-icon" href="/sct-brand/apple-touch-icon.png"><script src="/sct-brand/links.js"></script><script defer src="/sct-brand/login.js"></script></head>';
    }
}
